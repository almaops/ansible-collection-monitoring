---
- name: Ensure Loki directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ ct_loki_path_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ ct_loki_path_base }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ ct_loki_path_data }}"
      owner: "{{ ct_loki_uid }}"
      group: "{{ ct_loki_gid }}"
      mode: "0750"

- name: Render Loki configuration file
  ansible.builtin.template:
    src: "{{ ct_loki_template_config }}"
    dest: "{{ ct_loki_path_config }}"
    owner: root
    group: root
    mode: "0644"
  register: ct_loki_config_rendered

- name: Read rendered Loki configuration for hash calculation
  ansible.builtin.slurp:
    src: "{{ ct_loki_path_config }}"
  register: ct_loki_config_slurp
  when: not ansible_check_mode or ct_loki_config_rendered.changed

- name: Set Loki configuration SHA256 fact
  ansible.builtin.set_fact:
    ct_loki_config_hash: >-
      {{
        (ct_loki_config_slurp.content | b64decode | hash('sha256'))
        if (ct_loki_config_slurp is defined and ct_loki_config_slurp.content is defined)
        else (lookup('template', ct_loki_template_config) | hash('sha256'))
      }}

- name: Render Loki environment file
  ansible.builtin.template:
    src: "{{ ct_loki_template_env }}"
    dest: "{{ ct_loki_path_env }}"
    owner: root
    group: root
    mode: "0600"

- name: Render Docker Compose file for Loki
  ansible.builtin.template:
    src: "{{ ct_loki_template_compose }}"
    dest: "{{ ct_loki_path_compose }}"
    owner: root
    group: root
    mode: "0644"

- name: Ensure Loki compose stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ ct_loki_path_base }}"
    state: present
    pull: missing
    remove_orphans: true